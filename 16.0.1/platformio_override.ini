; Custom builds for WLED v16.0.1
; Usage: copy into the WLED source root (tag v16.0.1) as platformio_override.ini,
;        then build with e.g.  pio run -e lazy_grid_clock_esp32
;
; Since WLED 0.16/16.0 usermods are selected via `custom_usermods` (folder/library
; names under usermods/) instead of -D USERMOD_xxx flags.
;
; All builds come preconfigured to join WiFi "WLED".

[platformio]
default_envs = lazy_grid_clock_esp32, lazy_grid_clock_esp8266, wordclock_esp32

; ---------------------------------------------------------------------------
; Lazy Grid Clock  (Seven Segment Display Reloaded + SN Photoresistor)
; SSDR auto-detects SN_Photoresistor and enables auto brightness support.
; ---------------------------------------------------------------------------
[env:lazy_grid_clock_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D CLIENT_SSID='"WLED"' -D CLIENT_PASS='"***REMOVED***"'
custom_usermods = seven_segment_display_reloaded SN_Photoresistor

[env:lazy_grid_clock_esp8266]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D WLED_DISABLE_ALEXA -D CLIENT_SSID='"WLED"' -D CLIENT_PASS='"***REMOVED***"'
custom_usermods = seven_segment_display_reloaded SN_Photoresistor

; ---------------------------------------------------------------------------
; Word Clock
; ---------------------------------------------------------------------------
[env:wordclock_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D CLIENT_SSID='"WLED"' -D CLIENT_PASS='"***REMOVED***"'
custom_usermods = usermod_v2_word_clock
